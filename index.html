<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private Access Zone</title>
  <style>
    body {
      background-color: #0e0e0e;
      background-repeat: no-repeat;
      background-position: bottom right;
      background-size: 120px;
      background-blend-mode: soft-light;
      color: #d6d6d6;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .logo img {
      width: 200px;
      height: auto;
      border-radius: 6px;
    }

    h1 {
      color: #ff0040; 
    }

    .tiers {
      margin-top: 30px;
    }

    .tiers select {
      padding: 10px;
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
    }

    .contact {
      margin-top: 30px;
    }

    .img {
      width: 100%;
      border-radius: 10px;
    }

    .morse-box {
      position: absolute;
      top: 130px;
      left: 20px;
      background-color: rgba(20, 20, 20, 0.8);
      padding: 5px 10px;
      font-size: 12px;
      color: #aaa;
      border-radius: 4px;
      font-family: monospace;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #101010;
      color: #555;
      font-size: 10px;
      font-family: monospace;
      text-align: center;
      padding: 5px 0;
      letter-spacing: 1px;
      opacity: 0.3;
      user-select: none;
      z-index: 999;
    }

.bottom-nav:hover {
  opacity: 0.7;
}

.tx-id {
  display: inline-block;
  animation: flicker 5s infinite;
  word-break: break-all;
}

@keyframes flicker {
  0% { opacity: 0.3; }
  50% { opacity: 0.5; }
  100% { opacity: 0.3; }
}

  </style>
</head>
<body>

  <!-- Top-left logo -->
  <div class="logo">
    <img src="img/logo.jpg" alt="Private Logo" />
  </div>
  
  <h1>Private Access Zone</h1>
  <p>Access restricted. Verified buyers only.</p>
  <p>Visit <strong>http://veilxyz.onion</strong> on TOR</p>

  <div class="tiers">
    <label for="access-tier">Select Access Tier:</label><br/>
    <select id="access-tier">
      <option>Basic – Preview Listings</option>
      <option>Pro – Full Database Access</option>
      <option>VIP – Direct Contact</option>
    </select>
  </div>

  <div class="contact">
    <p>Contact: <strong>@veilchannel</strong> (Telegram)</p>
    <p>Alt Contact: veil_merchant@protonmail.com</p>
  </div>

  <div class="img-grid">
    <img src="img/bank.gif" alt="Urban clue 1" />
  </div>

  <div class="bottom-nav">
    <span class="tx-id">TXID: 4f9a2b7d3c9e8a1f6b0e7c4d2a5b3e1f</span>
  </div>
  
</body>
</html>
